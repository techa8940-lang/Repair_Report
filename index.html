<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout" id="app-layout">
    <!-- NUSP Left Sidebar -->
    <aside class="app-sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="javascript:void(0)" class="nusp-logo" onclick="setTab('home')">
          <img src="nu_seed_logo.png" alt="NU SEED" class="sidebar-logo-img">
          <div class="logo-text">
            <h2>NU SEED</h2>
            <span>Naresuan University Science Park</span>
          </div>
        </a>
      </div>

      <nav class="sidebar-menu" id="sidebar-menu">
        <!-- Rendered dynamically according to Active Role -->
      </nav>

      <div class="sidebar-footer" id="sidebar-footer">
        <button class="menu-link logout-btn" onclick="signOut()">
          <span class="menu-icon">🚪</span>
          <span>ออกจากระบบ</span>
        </button>
      </div>
    </aside>

    <!-- Mobile Drawer Backdrop Overlay -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar Navbar -->
      <header class="app-topbar" id="app-topbar">
        <div class="topbar-left">
          <button class="mobile-toggle" onclick="toggleSidebar()" aria-label="Toggle Menu">☰</button>
          <div class="topbar-title" id="page-title">ระบบแจ้งซ่อม</div>
        </div>

        <div class="topbar-right" id="topbar-right">
          <!-- Notification Bell, User Avatar & Admin Switcher -->
        </div>
      </header>

      <!-- Main Page View Container -->
      <main class="page-container" id="app">
        <!-- View Content Rendered Here -->
      </main>

      <!-- Mobile Bottom Navigation Bar (For elderly & mobile touch convenience) -->
      <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
        <!-- Rendered dynamically according to Active Role -->
      </nav>
    </div>
  </div>

  <dialog id="dlg"></dialog>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="user_views.js"></script>
  <script src="tech_views.js"></script>
  <script src="admin_views.js"></script>
</body>
</html>
